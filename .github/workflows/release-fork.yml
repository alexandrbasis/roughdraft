name: Release fork

on:
  push:
    tags: ["v*-basis.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'alexandrbasis/roughdraft'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.archive.outputs.tag }}
      prerelease: ${{ steps.archive.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:smoke
      - run: pnpm test:review
      - run: pnpm test:coverage
      - name: Prepare archive and checksum
        id: archive
        run: pnpm release:prepare
      - name: Test the archive that will be published
        env:
          RELEASE_TARBALL: ${{ steps.archive.outputs.tarball }}
        run: pnpm test:package --tarball "$RELEASE_TARBALL"
      - uses: actions/upload-artifact@v4
        with:
          name: tested-release
          path: ${{ steps.archive.outputs.directory }}
          if-no-files-found: error
          include-hidden-files: true

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tested-release
          path: release
      - name: Verify and publish tested artifacts
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          RELEASE_PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          sha256sum --check SHA256SUMS.txt
          args=(--verify-tag --generate-notes --title "Basis $RELEASE_TAG")
          if [ "$RELEASE_PRERELEASE" = true ]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" "${args[@]}" ./*.tgz SHA256SUMS.txt release-manifest.json
